async function loadClientIdentityMap(){
  // Los clientes actuales viven en este archivo; la tabla es opcional en el proyecto nuevo.
  // Si existe, la usamos para vincular IDs. Si no existe, los IDs locales son los IDs remotos.
  let dbClients=[];
  if(cloudClientsTableAvailable){
    try{
      dbClients=await cloudFetch('clientes','select=id,nombre,zona,estadoGeografico,estado&order=id.asc');
    }catch(firstError){
      try{dbClients=await cloudFetch('clientes','select=id,nombre,zona,estado&order=id.asc');}
      catch(secondError){cloudClientsTableAvailable=false;console.warn('BIPA: tabla clientes no disponible; se usaran los IDs locales',secondError);}
    }
  }
  clientDbIds.clear();
  clientLocalIds.clear();
  for(const c of CLIENTES){clientDbIds.set(String(c.id),String(c.id));clientLocalIds.set(String(c.id),String(c.id));}
  const buckets=new Map();
  for(const d of (dbClients||[])){const k=clientKey(d);if(!buckets.has(k))buckets.set(k,[]);buckets.get(k).push(String(d.id));}
  let matched=0;
  for(const c of CLIENTES){const k=clientKey(c);const bucket=buckets.get(k)||[];const dbid=bucket.shift();if(dbid){clientDbIds.set(String(c.id),dbid);clientLocalIds.set(dbid,String(c.id));matched++;}}
  console.info('BIPA: clientes vinculados',matched,'de',CLIENTES.length);
  return matched;
}
async function cloudFetch(table,query='',options={}){
  if(!cloudConfigured())return null;
  const r=await fetch(CLOUD.apiBase+'/'+table+(query?('?'+query):''),{...options,headers:{...cloudHeaders(),...(options.headers||{})}});
  if(!r.ok){const t=await r.text();throw new Error('Supabase '+r.status+' '+t)}
  const t=await r.text();return t?JSON.parse(t):[];
}
function dbProductId(id){

function migrateMapProductIds(map, mapper){
  const out={};
  for(const [cid,vals] of Object.entries(map||{})){
    out[cid]={};
    for(const [pid,val] of Object.entries(vals||{}))out[cid][mapper(pid)]=val;
  }
  return out;
}
async function cloudLoad(){
  if(!cloudConfigured())return;
  try{
    await loadClientIdentityMap();
    const [dbProducts,dbLinks,dbVisits]=await Promise.all([
      cloudFetch('productos','select=id,nombre,marca,codigo,peso&order=id.asc'),
      cloudFetch('cliente_productos','select=cliente_id,producto_id,precio,peso'),
      cloudFetch('visitas','select=cliente_id,visitado')
    ]);

    const merged=[];
    for(const p of (dbProducts||[])){
      merged.push({
        id:String(p.id),dbId:String(p.id),nombre:p.nombre||'',marca:p.marca||'',codigo:p.codigo||String(p.id),
        pesoBase:p.peso??'',precioBase:0
      });
    }
    // Cuando la nube está activa, esta lista solo refleja lo que realmente existe en Supabase.
    catalog=merged;

    const nextPrices={},nextWeights={},nextSelected={},nextVisits={};
    for(const r of (dbLinks||[])){
      const pid=localProductIdFromDb(String(r.producto_id));
      const cid=localClientId(r.cliente_id);
      if(!CLIENTES.some(c=>String(c.id)===String(cid)))continue;
      nextSelected[cid]=nextSelected[cid]||[];
      if(!nextSelected[cid].includes(pid))nextSelected[cid].push(pid);
      nextPrices[cid]=nextPrices[cid]||{}; if(r.precio!==null&&r.precio!==undefined)nextPrices[cid][pid]=Number(r.precio);
      nextWeights[cid]=nextWeights[cid]||{}; if(r.peso!==null&&r.peso!==undefined)nextWeights[cid][pid]=Number(r.peso);
      nextVisits[cid]='Visitado';
    }
    prices=nextPrices;weights=nextWeights;selectedProducts=nextSelected;

    for(const r of (dbVisits||[])){
      const cid=localClientId(r.cliente_id);
      if(!CLIENTES.some(c=>String(c.id)===String(cid)))continue;
      if(nextVisits[cid]==='Visitado')continue;
      nextVisits[cid]=r.visitado?'Visitado':'Pendiente';
    }

    visits=nextVisits;
    cloudReady=true;
    render();
  }catch(e){console.error('BIPA Supabase:',e);return false;}
  return true;
}
async function cloudSaveClientProduct(clientId,productId,price,weight){
  if(!cloudConfigured())return false;
  const dbId=dbProductId(productId);
  const dbClient=dbClientId(clientId);
  try{
    const existing=await cloudFetch('cliente_productos',`select=cliente_id,producto_id&cliente_id=eq.${encodeURIComponent(dbClient)}&producto_id=eq.${encodeURIComponent(dbId)}&limit=1`);
    const body={cliente_id:dbClient,producto_id:dbId,precio:price===undefined||price===''?null:Number(price),peso:weight===undefined||weight===''?null:Number(weight),};
    if(existing?.length){await cloudFetch('cliente_productos',`cliente_id=eq.${encodeURIComponent(dbClient)}&producto_id=eq.${encodeURIComponent(dbId)}`,{method:'PATCH',body:JSON.stringify(body)});}
    else await cloudFetch('cliente_productos','',{method:'POST',body:JSON.stringify(body)});
    return true;
  }catch(e){console.error(e);return false;}
}
async function cloudVisit(clientId,visitado){

    if(existing?.length)await cloudFetch('visitas',`cliente_id=eq.${encodeURIComponent(dbClient)}`,{method:'PATCH',body:JSON.stringify(body)});

}

async function syncFromCloud({refreshCatalog=false}={}){

function dashboardData(){
  const brandStats=new Map();
  const productStats=new Map();
  let clientsWithRadar=0;
  for(const c of CLIENTES){
    const ps=clientProducts(c.id);
    if(ps.length) clientsWithRadar++;
    for(const p of ps){
      const price=Number(prices[c.id]?.[p.id]);
      if(!Number.isFinite(price)) continue;
      const brand=p.marca||'Sin marca';
      if(!brandStats.has(brand)) brandStats.set(brand,{brand,count:0,sum:0,min:Infinity,max:-Infinity});
      const b=brandStats.get(brand); b.count++; b.sum+=price; b.min=Math.min(b.min,price); b.max=Math.max(b.max,price);
      const pid=p.id;
      if(!productStats.has(pid)) productStats.set(pid,{product:p,count:0,sum:0,min:Infinity,max:-Infinity});
      const pr=productStats.get(pid); pr.count++; pr.sum+=price; pr.min=Math.min(pr.min,price); pr.max=Math.max(pr.max,price);
    }
  }
  const brands=[...brandStats.values()].map(b=>({...b,avg:b.count?b.sum/b.count:0})).sort((a,b)=>a.avg-b.avg);
  const products=[...productStats.values()].map(p=>({...p,avg:p.count?p.sum/p.count:0})).sort((a,b)=>a.avg-b.avg);
  return {clientsWithRadar,brands,products};
}
function money(v){return Number.isFinite(Number(v))?`$${Number(v).toFixed(2)}`:'-';}
function normalizePriceText(value){
  let v=String(value??'').trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/[^0-9.]/g,'');
  if(!v)return '';
  const firstDot=v.indexOf('.');
  if(firstDot!==-1)v=v.slice(0,firstDot+1)+v.slice(firstDot+1).replace(/\./g,'');
  if(v.startsWith('.'))v='0'+v;
  return v;
}
function parsePriceValue(value){
  const normalized=normalizePriceText(value);
  if(normalized==='')return null;
  const n=Number(normalized);
  return Number.isFinite(n)?n:null;
}

async function saveProductEdit(){const id=state.editProductId;const p=catalog.find(x=>x.id===id);if(!p)return;const name=$('#editProductName')?.value.trim();const marca=$('#editProductBrand')?.value.trim();const peso=$('#editProductWeight')?.value.trim();if(!name||!marca){toast('Completa nombre y marca');return;}const old={...p};p.nombre=name;p.marca=marca;p.pesoBase=peso===''?'':Number(peso);const ok=await cloudEditProduct(p);if(!ok){Object.assign(p,old);toast('No se pudo actualizar el producto en Supabase');return;}if(!await syncFromCloud()){toast('Producto actualizado, pero no se pudo refrescar la pantalla');return;}state.editProductId=null;toast('Producto actualizado para todos los clientes');render();}
async function removeProductFromClient(productId){
  if(!state.selected)return;
  const clientId=state.selected.id;
  const current=Array.isArray(selectedProducts[clientId])?selectedProducts[clientId]:[];
  if(!current.includes(productId))return;
  const p=productById(productId);
  if(!confirm(`¿Quitar \"${p?.nombre||'este producto'}\" de este cliente?`))return;
  const ok=await cloudUnselected(clientId,productId);
  if(!ok){toast('No se pudo quitar el producto de este cliente en Supabase');return;}
  selectedProducts[clientId]=current.filter(pid=>String(pid)!==String(productId));
  if(prices[clientId])delete prices[clientId][productId];
  if(weights[clientId])delete weights[clientId][productId];
  await syncFromCloud();
  toast('Producto quitado del cliente');
  render();
}
async function deleteProductGlobal(id){const p=productById(id);if(!p)return;if(!confirm(`¿Eliminar "${p.nombre}" del catálogo global? Esto también lo quitará de todos los clientes.`))return;const ok=await cloudDeleteProduct(id);if(!ok){toast('No se pudo eliminar el producto de Supabase');return;}state.productSearch='';if(!await syncFromCloud()){toast('Producto eliminado, pero no se pudo refrescar la pantalla');return;}toast('Producto eliminado del catálogo global');render();}
async function addCatalogToClient(id){
  if(!state.selected)return;
  const clientId=state.selected.id;
  selectedProducts[clientId]=Array.isArray(selectedProducts[clientId])?selectedProducts[clientId]:[];
  if(!selectedProducts[clientId].includes(id)&&!await cloudSelected(clientId,id)){toast('No se pudo añadir el producto en Supabase');return;}
  visits[clientId]='Visitado';
  await cloudVisit(clientId,'Visitado');
  state.catalogOpen=false;
  state.productSearch='';
  if(!await syncFromCloud()){toast('Producto añadido, pero no se pudo refrescar la pantalla');return;}
  toast('Producto añadido al cliente');
  render();
}
async function createNewProduct(){
  const name=$('#newProductName')?.value.trim();
  const marca=$('#newProductBrand')?.value.trim();
  const peso=$('#newProductWeight')?.value.trim();
  if(!name||!marca){toast('Completa nombre y marca');return;}
  const id='PROD-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
  const p={id,nombre:name,marca,codigo:id,pesoBase:peso===''?'':Number(peso),precioBase:0};
  const created=await cloudCatalog(p);
  if(!created){toast('No se pudo crear el producto en Supabase');return;}
  if(created.id){p.dbId=String(created.id);p.id=String(created.id);p.codigo=created.codigo||p.codigo;}
  await syncFromCloud({refreshCatalog:true});
  if(state.selected){
    selectedProducts[state.selected.id]=Array.isArray(selectedProducts[state.selected.id])?selectedProducts[state.selected.id]:[];
    if(!selectedProducts[state.selected.id].includes(p.id)){
      selectedProducts[state.selected.id].push(p.id);
      if(!await cloudSelected(state.selected.id,p.id)){toast('Producto creado, pero no se pudo asociarlo al cliente');return;}
    }
    visits[state.selected.id]='Visitado';
    await cloudVisit(state.selected.id,'Visitado');
    await syncFromCloud();
  }
  state.newProductOpen=false;state.catalogOpen=true;state.productSearch='';toast('Producto creado y disponible para todos los clientes');render();requestAnimationFrame(()=>$('#catalogSearch')?.focus());
}

rk:bg-gray-900 p-2"><div class="text-slate-400">Promedio</div><div class="font-black">${money(b.avg)}</div></div><div class="rounded-xl bg-slate-50 dark:bg-gray-900 p-2"><div class="text-slate-400">Mín</div><div class="font-black">${money(b.min)}</div></div><div class="rounded-xl bg-slate-50 dark:bg-gray-900 p-2"><div class="text-slate-400">Máx</div><div class="font-black">${money(b.max)}</div></div></div></div>`).join(''):`<div class="py-10 text-center text-slate-400">No hay datos de marcas.</div>`}</div></div><div class="rounded-3xl bg-white dark:bg-gray-800 border border-slate-200 dark:border-gray-700 p-4 shadow-soft"><div class="mb-3"><h2 class="text-lg font-black">Productos comparados</h2><p class="text-xs text-slate-500">Selección filtrable por producto</p></div><div class="space-y-2">${products.length?products.map(p=>`<div class="rounded-2xl border border-slate-200 dark:border-gray-700 p-3"><div class="font-bold text-sm truncate">${esc(p.product.nombre)}</div><div class="text-xs text-slate-500 mb-2">${esc(p.product.marca)} · ${esc(p.product.codigo||'')}</div><div class="grid grid-cols-3 gap-2 text-xs"><div class="rounded-xl bg-slate-50 dark:bg-gray-900 p-2"><div class="text-slate-400">Promedio</div><div class="font-black">${money(p.avg)}</div></div><div class="rounded-xl bg-slate-50 dark:bg-gray-900 p-2"><div class="text-slate-400">Mín</div><div class="font-black">${money(p.min)}</div></div><div class="rounded-xl bg-slate-50 dark:bg-gray-900 p-2"><div class="text-slate-400">Máx</div><div class="font-black">${money(p.max)}</div></div></div></div>`).join(''):`<div class="py-10 text-center text-slate-400">No hay datos de productos.</div>`}</div></div></section><div id="toast"></div></div>`;
}
const filterTimers=new Map();
function bindFilter(inputId,stateKey){
  const input=$(inputId);if(!input)return;
  input.oninput=e=>{
    state[stateKey]=e.target.value;
    const prevTimer=filterTimers.get(inputId);
    if(prevTimer)clearTimeout(prevTimer);
    filterTimers.set(inputId,setTimeout(()=>{
      const keepFocus=document.activeElement===input;
      render();
      if(keepFocus)requestAnimationFrame(()=>{const next=$(inputId);if(next){next.focus();next.setSelectionRange(state[stateKey].length,state[stateKey].length);}});
    },120));
  };
}
function render(){
  const active=document.activeElement;
  const keep=active&&active.matches('input,select,textarea');
  const focusId=keep?active.id:'';
  const priceId=keep&&active.dataset.price!==undefined?active.dataset.price:'';
  const value=keep?active.value:'';
  const start=keep&&typeof active.selectionStart==='number'?active.selectionStart:null;
  const end=keep&&typeof active.selectionEnd==='number'?active.selectionEnd:null;
  const scrollX=window.scrollX, scrollY=window.scrollY;
  const root=$('#app');root.innerHTML=state.view==='home'?home():state.view==='dashboard'?dashboard():clientView(state.selected);bind();
  if(keep)requestAnimationFrame(()=>{
    const next=priceId?[...document.querySelectorAll('[data-price]')].find(x=>x.dataset.price===priceId):focusId?$('#'+focusId):null;
    if(!next)return;
    next.focus();
    if(priceId)next.value=value;
    if(start!==null&&typeof next.setSelectionRange==='function')next.setSelectionRange(start,end===null?start:end);
  });
  requestAnimationFrame(()=>window.scrollTo(scrollX,scrollY));
}
function bind(){const t=$('#themeBtn');if(t)t.onclick=()=>{document.documentElement.classList.toggle('dark');localStorage.setItem(STORAGE.theme,document.documentElement.classList.contains('dark')?'dark':'light');};const ex=$('#exportBtn');if(ex)ex.onclick=exportCSV;const ex2=$('#exportBtn2');if(ex2)ex2.onclick=exportCSV;bindFilter('#search','search');const z=$('#zone');if(z)z.onchange=e=>{state.zone=e.target.value;render()};const gs=$('#geoState');if(gs)gs.onchange=e=>{state.geoState=e.target.value;render()};const v=$('#visit');if(v)v.onchange=e=>{state.visit=e.target.value;render()};const back=$('#backBtn');if(back)back.onclick=()=>{state.view='home';state.selected=null;state.productSearch='';render()};document.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>editProduct(b.dataset.editProduct));document.querySelectorAll('[data-remove-product]').forEach(b=>b.onclick=()=>removeProductFromClient(b.dataset.removeProduct));bindFilter('#productSearch','productSearch');document.querySelectorAll('[data-price]').forEach(input=>{input.onblur=()=>{const normalized=normalizePriceText(input.value);if(input.value!==normalized)input.value=normalized;};});const saveBtn=$('#savePrices');if(saveBtn)saveBtn.onclick=async()=>{prices[state.selected.id]=prices[state.selected.id]||{};const payload=[];document.querySelectorAll('[data-price]').forEach(i=>{const raw=i.value.trim();const numeric=parsePriceValue(raw);if(numeric===null)delete prices[state.selected.id][i.dataset.price];else prices[state.selected.id][i.dataset.price]=numeric;payload.push(cloudPrice(state.selected.id,i.dataset.price,numeric===null?'':numeric));});visits[state.selected.id]='Visitado';payload.push(cloudVisit(state.selected.id,'Visitado'));const results=await Promise.all(payload);if(!results.every(Boolean)||!await syncFromCloud()){toast('No se pudo guardar el registro en Supabase');return;}toast('Registro guardado correctamente');};const openC=$('#openCatalog');if(openC)openC.onclick=()=>{state.catalogOpen=true;state.newProductOpen=false;state.editProductId=null;state.productSearch='';render();requestAnimationFrame(()=>$('#catalogSearch')?.focus());syncFromCloud({refreshCatalog:true});};const closeC=$('#closeCatalog');if(closeC)closeC.onclick=()=>{state.catalogOpen=false;state.productSearch='';render()};bindFilter('#catalogSearch','productSearch');document.querySelectorAll('[data-add-catalog]').forEach(b=>b.onclick=()=>addCatalogToClient(b.dataset.addCatalog));document.querySelectorAll('[data-edit-catalog]').forEach(b=>b.onclick=()=>editProduct(b.dataset.editCatalog));document.querySelectorAll('[data-delete-catalog]').forEach(b=>b.onclick=()=>deleteProductGlobal(b.dataset.deleteCatalog));const openN=$('#openNewProduct');if(openN)openN.onclick=()=>{state.newProductOpen=true;state.catalogOpen=true;render();requestAnimationFrame(()=>$('#newProductName')?.focus());};const closeN=$('#closeNewProduct');if(closeN)closeN.onclick=()=>{state.newProductOpen=false;render();requestAnimationFrame(()=>$('#catalogSearch')?.focus());};const form=$('#newProductForm');if(form)form.onsubmit=e=>{e.preventDefault();createNewProduct();};const closeE=$('#closeEditProduct');if(closeE)closeE.onclick=()=>{state.editProductId=null;render();requestAnimationFrame(()=>$('#catalogSearch')?.focus());};const editForm=$('#editProductForm');if(editForm)editForm.onsubmit=e=>{e.preventDefault();saveProductEdit();};}

document.addEventListener('click',e=>{const dash=e.target.closest('#dashboardBtn');if(dash){e.preventDefault();state.view='dashboard';render();}});

document.addEventListener('click',e=>{const card=e.target.closest('[data-client]');if(card){e.preventDefault();const cliente=CLIENTES.find(c=>String(c.id)===String(card.dataset.client));if(cliente){state.selected=cliente;state.view='client';state.productSearch='';state.catalogOpen=false;state.newProductOpen=false;render();}}});

function exportCSV(){const rows=[["Cliente","Marca","Producto","Peso","Precio"]];CLIENTES.forEach(c=>{const ps=clientProducts(c.id);ps.forEach(p=>{rows.push([c.nombre,p.marca,p.nombre,p.pesoBase??"",prices[c.id]?.[p.id]??""])})});const csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`bipa_track_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);toast("CSV exportado");}
let toastTimer;function toast(msg){clearTimeout(toastTimer);const el=$('#toast');if(!el)return;el.innerHTML=`<div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-3 rounded-2xl bg-gray-900 text-white shadow-xl flex items-center gap-2 text-sm font-bold"><i class="fa-solid fa-circle-check text-emerald-400"></i>${esc(msg)}</div>`;toastTimer=setTimeout(()=>el.innerHTML='',3000)}
(function(){if(cloudConfigured()){setTimeout(()=>syncFromCloud({refreshCatalog:true}),250);cloudTimer=setInterval(()=>{if(document.visibilityState==='visible')syncFromCloud({refreshCatalog:true});},15000);}})();

(function(){if(localStorage.getItem(STORAGE.theme)==='dark'||(!localStorage.getItem(STORAGE.theme)&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark');render()})();
