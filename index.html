<script>
const STORAGE={
  prices:'bipa_prices_v1',
  weights:'bipa_weights_v1',
  productEdits:'bipa_product_edits_v1',
  visits:'bipa_visits_v1',
  custom:'bipa_custom_products_v1',
  catalog:'bipa_product_catalog_v2',
  selectedProducts:'bipa_selected_products_v2',
  theme:'bipa_theme_v1',
  activityLog:'bipa_activity_log_v1'
};

const readLocalStorage=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const writeLocalStorage=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let activityLog=readLocalStorage(STORAGE.activityLog,[]);

function formatActivityTime(ts){
  const d=new Date(ts);
  if(Number.isNaN(d.getTime()))return '';
  return d.toLocaleString('es-VE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function recordActivity(type,title,detail=''){
  activityLog=[{type,title,detail,time:Date.now()},...activityLog].slice(0,30);
  writeLocalStorage(STORAGE.activityLog,activityLog);
}

function activityIcon(type){
  return ({
    visit:'fa-check',
    price:'fa-money-bill-wave',
    product:'fa-box',
    catalog:'fa-list-check',
    edit:'fa-pen',
    delete:'fa-trash',
    sync:'fa-arrows-rotate'
  })[type]||'fa-bolt';
}

function sortByText(a,b){
  return String(a).localeCompare(String(b),'es',{sensitivity:'base',numeric:true});
}

function catalogProducts(){
  return catalog
    .map(p=>({
      ...p,
      nombre:productEdits[p.id]?.nombre||p.nombre,
      marca:productEdits[p.id]?.marca||p.marca,
      pesoBase:productEdits[p.id]?.pesoBase??p.pesoBase??''
    }))
    .sort((a,b)=>sortByText(a.nombre,b.nombre)||sortByText(a.marca,b.marca));
}

function clientProducts(id){
  const ids=Array.isArray(selectedProducts[id])?selectedProducts[id]:[];
  return ids
    .map(productById)
    .filter(Boolean)
    .sort((a,b)=>sortByText(a.nombre,b.nombre)||sortByText(a.marca,b.marca));
}

function filteredClients(){
  const q=state.search.trim().toLowerCase();
  return CLIENTES
    .filter(c=>
      (!q||c.nombre.toLowerCase().includes(q)||c.zona.toLowerCase().includes(q)||c.estadoGeografico.toLowerCase().includes(q)) &&
      (state.zone==='ALL'||c.zona===state.zone) &&
      (state.geoState==='ALL'||c.estadoGeografico===state.geoState) &&
      (state.visit==='ALL'||visitStatus(c.id)===state.visit)
    )
    .sort((a,b)=>{
      const va=visitStatus(a.id)==='Visitado'?0:1;
      const vb=visitStatus(b.id)==='Visitado'?0:1;
      return va-vb||sortByText(a.nombre,b.nombre)||sortByText(a.zona,b.zona);
    });
}

let filterTimer=null;
let uiInteractionTimer=null;
let uiInteractionUntil=0;

function noteUIInteraction(){
  uiInteractionUntil=Date.now()+900;
  clearTimeout(uiInteractionTimer);
  uiInteractionTimer=setTimeout(()=>{
    if(Date.now()>=uiInteractionUntil)uiInteractionUntil=0;
  },950);
}

function isFieldFocused(){
  const a=document.activeElement;
  return !!a&&a.matches('input,select,textarea');
}

function bindFilter(inputId,stateKey){
  const input=$(inputId);
  if(!input)return;
  input.oninput=e=>{
    noteUIInteraction();
    state[stateKey]=e.target.value;
    clearTimeout(filterTimer);
    filterTimer=setTimeout(()=>{
      const keepFocus=document.activeElement===input;
      render();
      if(keepFocus)requestAnimationFrame(()=>{
        const next=$(inputId);
        if(next){
          try{next.focus({preventScroll:true});}
          catch{next.focus();}
        }
      });
    },220);
  };
}

function render(){
  const active=document.activeElement;
  const keep=active&&active.matches('input,select,textarea');
  const focusId=keep?active.id:'';
  const priceId=keep&&active.dataset.price!==undefined?active.dataset.price:'';
  const value=keep?active.value:'';
  const scrollX=window.scrollX,scrollY=window.scrollY;
  const root=$('#app');
  root.innerHTML=state.view==='home'?home():state.view==='dashboard'?dashboard():clientView(state.selected);
  bind();
  if(keep)requestAnimationFrame(()=>{
    const next=priceId
      ?[...document.querySelectorAll('[data-price]')].find(x=>x.dataset.price===priceId)
      :focusId?$('#'+focusId):null;
    if(!next)return;
    try{next.focus({preventScroll:true});}catch{next.focus();}
    if(priceId)next.value=value;
    window.scrollTo(scrollX,scrollY);
  });
}

function dashboard(){
  const d=dashboardData();
  const brandOpts=[...new Set(d.brands.map(b=>b.brand))].sort((a,b)=>a.localeCompare(b,'es'));
  const prodOpts=[...new Set(d.products.map(p=>p.product.nombre))].sort((a,b)=>a.localeCompare(b,'es'));
  const recent=activityLog.slice(0,8);
  // ... resto del dashboard ...
  return `...`;
}

function saveProductEdit(){
  // ...
  recordActivity('edit','Producto actualizado',`${p.nombre} · ${p.marca}`);
}

async function removeProductFromClient(productId){
  // ...
  if(!await syncFromCloud()){
    toast('Producto quitado, pero no se pudo refrescar la pantalla');
    return;
  }
  recordActivity('delete','Producto retirado del cliente',`${p?.nombre||'Producto'} · ${state.selected.nombre}`);
  toast('Producto quitado del cliente');
  render();
}

async function deleteProductGlobal(id){
  // ...
  recordActivity('delete','Producto eliminado del catálogo',`${p.nombre} · ${p.marca}`);
}

async function addCatalogToClient(id){
  // ...
  recordActivity('catalog','Producto añadido al cliente',`${p?.nombre||'Producto'} · ${state.selected.nombre}`);
}

async function createNewProduct(){
  // ...
  recordActivity('product','Nuevo producto creado',`${p.nombre} · ${p.marca}`);
}

function bind(){
  // ...
  document.querySelectorAll('.statusBtn').forEach(b=>b.onclick=async()=>{
    noteUIInteraction();
    const cid=state.selected.id, next=b.dataset.status;
    const previous=visits[cid]||'Pendiente';
    visits[cid]=next;
    render();
    const ok=await cloudVisit(cid,next);
    if(ok&&await syncFromCloud()){
      recordActivity(
        'visit',
        next==='Visitado'?'Visita marcada como visitado':'Visita destildada',
        state.selected.nombre
      );
      toast(next==='Visitado'?'Visita guardada en la nube':'Visita destildada y guardada');
    }else{
      visits[cid]=previous;
      toast('ERROR: no se pudo guardar la visita en Supabase');
      render();
    }
  });

  const saveBtn=$('#savePrices');
  if(saveBtn)saveBtn.onclick=async()=>{
    prices[state.selected.id]=prices[state.selected.id]||{};
    const payload=[];
    document.querySelectorAll('[data-price]').forEach(i=>{
      const val=i.value.trim();
      if(val==='')delete prices[state.selected.id][i.dataset.price];
      else prices[state.selected.id][i.dataset.price]=Number(val);
      payload.push(cloudPrice(state.selected.id,i.dataset.price,val===''?'':Number(val)));
    });
    const results=await Promise.all(payload);
    if(!results.every(Boolean)||!await syncFromCloud()){
      toast('No se pudo guardar el registro en Supabase');
      return;
    }
    recordActivity('price','Precios guardados',state.selected.nombre);
    toast('Registro guardado correctamente');
  };

  // ...
}

(function(){
  if(cloudConfigured()){
    setTimeout(()=>syncFromCloud({refreshCatalog:true}),250);
    cloudTimer=setInterval(()=>{
      if(document.visibilityState==='visible'&&!isFieldFocused()&&Date.now()>=uiInteractionUntil){
        syncFromCloud({refreshCatalog:true});
      }
    },15000);
  }
})();
</script>
